name: Build Windows

on:
  push:
    branches: [ fix/skip-unsupported-cas-chunks ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-qt6-serialport
          mingw-w64-x86_64-qt6-5compat
          mingw-w64-x86_64-libssh
          mingw-w64-x86_64-zlib
          make

    - name: Configure CMake
      run: |
        cmake -B build -G "MSYS Makefiles" \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --parallel

    - name: Deploy
      run: |
        mkdir -p deploy
        cp build/AspeQt.exe deploy/
        # Use ldd to find ALL required DLLs from mingw64
        ldd build/AspeQt.exe | grep '/mingw64/' | awk '{print $3}' | while read dll; do
          cp "$dll" deploy/
        done
        # Qt plugins
        QTPLUGINS="/mingw64/share/qt6/plugins"
        mkdir -p deploy/platforms deploy/styles deploy/tls deploy/imageformats
        cp "$QTPLUGINS/platforms/qwindows.dll" deploy/platforms/
        # Copy plugin deps too
        for dir in platforms styles tls imageformats; do
          if [ -d "$QTPLUGINS/$dir" ]; then
            cp "$QTPLUGINS/$dir"/*.dll deploy/$dir/ 2>/dev/null || true
            for pdll in deploy/$dir/*.dll; do
              ldd "$pdll" 2>/dev/null | grep '/mingw64/' | awk '{print $3}' | while read dll; do
                cp -n "$dll" deploy/ 2>/dev/null || true
              done
            done
          fi
        done

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AspeQt-Windows
        path: deploy/

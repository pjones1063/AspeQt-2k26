name: Build & Package macOS (ARM64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libssh via Homebrew
        run: |
          brew update
          brew install libssh

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build AspeQt
        run: |
          cmake --build build --parallel

      - name: Bundle, sign, and create DMG
        run: |
          rm -rf release stage
          mkdir -p release stage/doc stage/atari

          macdeployqt build/AspeQt.app -executable=build/AspeQt.app/Contents/MacOS/AspeQt -always-overwrite
          codesign --force --deep --sign - build/AspeQt.app

          cp -R build/AspeQt.app stage/
          cp -R doc/* stage/doc/
          cp atari/*.atr atari/*.car stage/atari/

          hdiutil create -volname "AspeQt-2K26" -srcfolder stage -ov -format UDZO release/AspeQt-2K26-macOS.dmg

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AspeQt-2K26-macos-arm64
          path: release/AspeQt-2K26-macOS.dmg
          if-no-files-found: error
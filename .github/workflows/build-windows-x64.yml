name: Build & Package Windows (x64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64) with Qt 6 and libssh
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-serialport
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-webchannel
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build AspeQt
        run: |
          cmake --build build --parallel

      - name: Stage with windeployqt, DLLs, docs, and Atari files
        run: |
          rm -rf release/win-temp
          mkdir -p release/win-temp/doc release/win-temp/atari
          cp build/AspeQt.exe release/win-temp/
          cp -r doc/* release/win-temp/doc/
          cp atari/*.atr atari/*.car release/win-temp/atari/

          windeployqt --dir release/win-temp release/win-temp/AspeQt.exe

          find release/win-temp -type f \( -name "*.exe" -o -name "*.dll" \) -print0 \
            | xargs -0 ldd \
            | awk '/=> \/ucrt64\/bin\// { print $3 }' \
            | sort -u \
            | xargs -r -I{} cp -u "{}" release/win-temp/

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "release\win-temp\*" -DestinationPath "release\AspeQt-2K26-Portable.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $IssFile = Get-ChildItem -Recurse -Filter "AspeQt-Installer.iss" | Select-Object -First 1
          if (-not $IssFile) {
            Write-Error "Could not find AspeQt-Installer.iss in repository."
            exit 1
          }

          $Iscc = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $Iscc) {
            $DefaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $DefaultIscc) {
              $Iscc = $DefaultIscc
            } else {
              choco install innosetup -y
              $Iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }

          & $Iscc $IssFile.FullName

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AspeQt-2K26-windows-x64
          path: |
            release/AspeQt-2K26-Portable.zip
            release/*.exe
          if-no-files-found: error
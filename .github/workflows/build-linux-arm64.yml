name: Build & Package Linux (ARM64 / Pi)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system, libgpiod v2, and Qt 6 ARM64 dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            file \
            dpkg-dev \
            libssh-dev \
            libgpiod-dev \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-serialport-dev \
            qt6-websockets-dev \
            qt6-webchannel-dev \
            qt6-httpserver-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-l10n-tools

      - name: Normalize timestamps to prevent clock-skew loops
        run: |
          find . -not -path '*/.git/*' -exec touch -m {} +

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build AspeQt
        run: |
          cmake --build build --parallel

      - name: Package (.deb and portable .tar.gz)
        run: |
          rm -rf release stage
          mkdir -p release stage/doc stage/atari

          cp build/AspeQt stage/
          cp -r doc/* stage/doc/
          cp atari/*.atr atari/*.car stage/atari/

          cd build
          cpack -G DEB
          mv *.deb ../release/
          cd ..

          tar -cvzf release/AspeQt-2K26-pi.64-portable.tar.gz -C stage .

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AspeQt-2K26-linux-arm64
          path: |
            release/*.deb
            release/AspeQt-2K26-pi.64-portable.tar.gz
          if-no-files-found: error
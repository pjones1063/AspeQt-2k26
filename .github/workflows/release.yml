name: Build and Release AspeQt-2k26

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. MACOS BUILD
  # ==========================================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*' # Aligned with Windows
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Install libssh
        run: brew install libssh

      - name: Compile AspeQt
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Package with macdeployqt, Add Extras, and Sign
        run: |
          macdeployqt build/AspeQt.app -executable="build/AspeQt.app/Contents/MacOS/AspeQt" -always-overwrite
          
          # Sign the app bundle FIRST
          codesign --force --deep --sign - build/AspeQt.app
          
          # Create a staging folder
          mkdir dmg_staging
          
          # Use macOS native 'ditto' instead of cp to safely clone the app bundle without tripping locks
          ditto build/AspeQt.app dmg_staging/AspeQt.app
          
          # Copy extras alongside the .app
          cp -r doc dmg_staging/
          cp -r atari dmg_staging/
          cp -r python_w_samples dmg_staging/
          
          # Sync and wait slightly longer for macOS background indexing
          sync
          sleep 10
          
          # Create DMG with a robust retry loop (tries 5 times, waiting 5 seconds between failures)
          for i in {1..5}; do
            echo "Attempt $i to create DMG..."
            hdiutil create -volname "AspeQt-2K26" -srcfolder dmg_staging -ov -format UDZO AspeQt-2K26-macOS.dmg && break || sleep 5
          done

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: AspeQt-2K26-macOS.dmg


  # ==========================================
  # 2. WINDOWS BUILD
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and libssh
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-libssh

      - name: Install Qt
        id: qt-install
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_mingw
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'
          tools: 'tools_mingw'

      - name: Compile AspeQt
        shell: pwsh 
        run: |
          $QtRoot = $env:QT_ROOT_DIR
          $Msys2Path = "C:\msys64"
          
          # Use the IQTA_TOOLS variable - this is the source of truth for the compiler
          Write-Host "Locating MinGW in $env:IQTA_TOOLS..." -ForegroundColor Cyan
          
          # Find the folder starting with 'mingw' inside the Tools directory
          $MinGWDir = Get-ChildItem -Path "$env:IQTA_TOOLS" -Directory -Filter "mingw*" | Select-Object -First 1
          
          if (-not $MinGWDir) {
              Write-Error "Could not find any MinGW directory in $env:IQTA_TOOLS"
              exit 1
          }
          
          $CompilerBin = "$($MinGWDir.FullName)\bin"
          Write-Host "Found compiler bin at: $CompilerBin" -ForegroundColor Green
    
          # Add the discovered compiler to the PATH to shadow the system GCC
          $env:PATH = "$CompilerBin;" + $env:PATH

          if (!(Test-Path "build")) { mkdir build }
          cd build
          
          # Correct prefix path for finding libssh and Qt in MSYS2/Qt trees
          $env:CMAKE_PREFIX_PATH = "$QtRoot;$Msys2Path\ucrt64"
          
          cmake .. -G "MinGW Makefiles" `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_MAKE_PROGRAM="$CompilerBin\mingw32-make.exe" `
              -DCMAKE_CXX_COMPILER="$CompilerBin\g++.exe" `
              -DCMAKE_C_COMPILER="$CompilerBin\gcc.exe" `
              -DCMAKE_RC_COMPILER="$CompilerBin\windres.exe" 
              
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . -j4

      - name: Package with windeployqt & Add Extras
        shell: pwsh
        run: |
          $QtBin = "$($env:QT_ROOT_DIR)\bin"
          New-Item -ItemType Directory -Force -Path "release/win-temp"
          Copy-Item "build/AspeQt.exe" "release/win-temp/" -Force
          
          # Use absolute path to windeployqt
          & "$QtBin\windeployqt.exe" --compiler-runtime --dir "release/win-temp" "release/win-temp/AspeQt.exe"
          
          # Copy extra assets
          Copy-Item -Path "doc", "atari", "python_w_samples" -Destination "release/win-temp/" -Recurse -Force

      - name: Copy MSYS2 Dependencies
        shell: pwsh 
        run: |
          $BinPath = "C:\msys64\ucrt64\bin"
          # Explicitly copy libssh and required support DLLs
          Copy-Item "$BinPath\libssh.dll", "$BinPath\zlib1.dll" -Destination "release\win-temp\" -Force
          Copy-Item "$BinPath\libcrypto-*.dll", "$BinPath\libssl-*.dll" -Destination "release\win-temp\" -Force

      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release/win-temp/*" -DestinationPath "AspeQt-2K26-Windows-Portable.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Locate the .iss file and run the compiler
          $issFile = Get-ChildItem -Path . -Filter "AspeQt-Installer.iss" -Recurse | Select-Object -First 1
          if ($issFile) { 
              iscc $issFile.FullName 
          } else { 
              Write-Error "Installer script not found!"
              exit 1 
          }

      - name: Upload Windows Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: |
            AspeQt-2K26-Windows-Portable.zip
            release/AspeQt-2K26-Setup.exe

                        
  # ==========================================
  # 3. LINUX BUILD (AMD64)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Git (Required for Checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System and Qt6 Dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates unzip wget build-essential cmake pkg-config file libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libxkbcommon-dev libx11-xcb-dev libgl1-mesa-dev libcups2-dev libgpiod-dev
          
      - name: Compile, Package, and Inject Extras
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB
          
          # Inject extras into the generated DEB file
          DEB_FILE=$(ls *.deb | head -n 1)
          mkdir -p repack/DEBIAN
          dpkg-deb -x "$DEB_FILE" repack/
          dpkg-deb -e "$DEB_FILE" repack/DEBIAN
          
          # Create a folder for the assets and copy them in
          mkdir -p repack/usr/share/aspeqt
          cp -r ../doc repack/usr/share/aspeqt/
          cp -r ../atari repack/usr/share/aspeqt/
          cp -r ../python_w_samples repack/usr/share/aspeqt/
          
          # Repack the DEB and rename for release
          dpkg-deb -b repack ../AspeQt-2K26-Linux-amd64.deb

      - name: Upload Linux Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Release
          path: AspeQt-2K26-Linux-amd64.deb

  # ==========================================
  # 4. RASPBERRY PI BUILD (ARM64)
  # ==========================================
  build-pi:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Install Git (Required for Checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System and Qt6 Dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates unzip wget build-essential cmake pkg-config file libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libxkbcommon-dev libx11-xcb-dev libgl1-mesa-dev libcups2-dev libgpiod-dev
      
      - name: Compile AspeQt for Pi and Inject Extras
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB
          
          # Inject extras into the generated DEB file
          DEB_FILE=$(ls *.deb | head -n 1)
          mkdir -p repack/DEBIAN
          dpkg-deb -x "$DEB_FILE" repack/
          dpkg-deb -e "$DEB_FILE" repack/DEBIAN
          
          # Create a folder for the assets and copy them in
          mkdir -p repack/usr/share/aspeqt
          cp -r ../doc repack/usr/share/aspeqt/
          cp -r ../atari repack/usr/share/aspeqt/
          cp -r ../python_w_samples repack/usr/share/aspeqt/
          
          # Repack the DEB and rename for release
          dpkg-deb -b repack ../AspeQt-2K26-pi.64.deb

      - name: Upload Pi Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryPi-Release
          path: AspeQt-2K26-pi.64.deb

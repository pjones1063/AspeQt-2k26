name: Build and Release AspeQt-2k26

on: 
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. MACOS BUILD
  # ==========================================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Install libssh
        run: brew install libssh

      - name: Compile AspeQt
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Package with macdeployqt and Sign
        run: |
          # 1. Bundle all Qt libraries and libssh into the .app
          macdeployqt build/AspeQt.app -executable="build/AspeQt.app/Contents/MacOS/AspeQt" -always-overwrite
          
          # 2. Apply a deep Ad-Hoc signature to satisfy Apple Silicon strict requirements
          codesign --force --deep --sign - build/AspeQt.app
          
          # 3. Create the DMG image using native macOS tools
          hdiutil create -volname "AspeQt-2K26" -srcfolder build/AspeQt.app -ov -format UDZO AspeQt-2K26-macOS.dmg

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: AspeQt-2K26-macOS.dmg

  # ==========================================
  # 2. WINDOWS BUILD
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and libssh
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-libssh mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: win64_mingw
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Compile AspeQt
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j4

      - name: Package with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\win-temp"
          Copy-Item "build\AspeQt.exe" "release\win-temp\"
          windeployqt.exe --dir "release\win-temp" "release\win-temp\AspeQt.exe"

      - name: Copy MSYS2 Dependencies
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/libssh.dll release/win-temp/
          cp /mingw64/bin/libcrypto-*.dll release/win-temp/
          cp /mingw64/bin/zlib1.dll release/win-temp/

      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release\win-temp\*" -DestinationPath "AspeQt-2K26-Windows-Portable.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $issFile = Get-ChildItem -Path . -Filter "AspeQt-Installer.iss" -Recurse | Select-Object -First 1
          if ($issFile) {
              Write-Host "Found installer script at: $($issFile.FullName)" -ForegroundColor Cyan
              iscc $issFile.FullName
          } else {
              Write-Error "CRITICAL: Could not find AspeQt-Installer.iss anywhere in the repository!"
              exit 1
          }

      - name: Upload Windows Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: |
            AspeQt-2K26-Windows-Portable.zip
            release/AspeQt-2K26-Setup.exe

  # ==========================================
  # 3. LINUX BUILD (Native .deb & AppImage)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Native Qt6
        run: |
          sudo apt-get update
          # Switched to native apt-get so CPack can properly map Debian dependencies, added libfuse2 for AppImage
          sudo apt-get install -y build-essential cmake libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libgl1-mesa-dev libxkbcommon-dev libx11-xcb-dev libfuse2

      - name: Compile AspeQt
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Package Native .deb
        run: |
          cd build
          # SHLIBDEPS automatically links all required Qt libraries into the .deb control file
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON
          mv *.deb ../AspeQt-2K26-Linux.deb
          cd ..

      - name: Package Portable AppImage
        run: |
          # Create standardized AppDir folder structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/AspeQt AppDir/usr/bin/
          
          # Create a VALID dummy transparent icon (linuxdeployqt crashes on 0-byte files)
          convert -size 256x256 xc:transparent AppDir/usr/share/icons/hicolor/256x256/apps/aspeqt.png
          
          # Dummy desktop file required by the bundler
          cat <<EOF > AppDir/usr/share/applications/aspeqt.desktop
          [Desktop Entry]
          Type=Application
          Name=AspeQt
          Exec=AspeQt
          Icon=aspeqt
          Categories=Utility;
          EOF
          
          # Download and run linuxdeployqt to bundle all libraries
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage AppDir/usr/share/applications/aspeqt.desktop -appimage -unsupported-allow-new-glibc -qmake=$(which qmake6)
          mv AspeQt-*-x86_64.AppImage AspeQt-2K26-Linux-Portable.AppImage

      - name: Upload Linux Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Release
          path: |
            AspeQt-2K26-Linux.deb
            AspeQt-2K26-Linux-Portable.AppImage

  # ==========================================
  # 4. RASPBERRY PI BUILD (ARM64)
  # ==========================================
  build-pi:
    runs-on: ubuntu-24.04-arm 
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt6 and Dependencies via apt
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libxkbcommon-dev libx11-xcb-dev libfuse2

      - name: Compile AspeQt for Pi
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Package Pi .deb and Portable
        run: |
          cd build
          # SHLIBDEPS automatically links all required Qt libraries into the .deb control file
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON
          mv *.deb ../AspeQt-2K26-pi.64.deb
          cd ..
          tar -cvzf AspeQt-2K26-pi.64-portable.tar.gz -C build AspeQt

      - name: Upload Pi Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryPi-Release
          path: |
            AspeQt-2K26-pi.64.deb
            AspeQt-2K26-pi.64-portable.tar.gz
            

name: Build and Release AspeQt-2k26

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. MACOS BUILD
  # ==========================================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Install libssh
        run: brew install libssh

      - name: Compile AspeQt
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Package with macdeployqt, Add Extras, and Sign
        run: |
          macdeployqt build/AspeQt.app -executable="build/AspeQt.app/Contents/MacOS/AspeQt" -always-overwrite
          codesign --force --deep --sign - build/AspeQt.app
          
          # Create a staging folder and move the App inside
          mkdir dmg_staging
          mv build/AspeQt.app dmg_staging/
          
          # Copy extras alongside the .app
          cp -r doc dmg_staging/
          cp -r atari dmg_staging/
          cp -r python_w_samples dmg_staging/
          
          # Create DMG
          hdiutil create -volname "AspeQt-2K26" -srcfolder dmg_staging -ov -format UDZO AspeQt-2K26-macOS.dmg

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: AspeQt-2K26-macOS.dmg

  # ==========================================
  # 2. WINDOWS BUILD
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and libssh
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-libssh mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: win64_mingw
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Compile AspeQt
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j4

      - name: Package with windeployqt & Add Extras
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/win-temp"
          Copy-Item "build/AspeQt.exe" "release/win-temp/"
          windeployqt.exe --dir "release/win-temp" "release/win-temp/AspeQt.exe"
          
          # Copy extras into the Windows staging folder
          Copy-Item -Path "doc" -Destination "release/win-temp/" -Recurse
          Copy-Item -Path "atari" -Destination "release/win-temp/" -Recurse
          Copy-Item -Path "python_w_samples" -Destination "release/win-temp/" -Recurse

      - name: Copy MSYS2 Dependencies
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/libssh.dll release/win-temp/
          cp /mingw64/bin/libcrypto-*.dll release/win-temp/
          cp /mingw64/bin/libssl-*.dll release/win-temp/
          cp /mingw64/bin/zlib1.dll release/win-temp/
          cp /mingw64/bin/libstdc++-6.dll release/win-temp/
          cp /mingw64/bin/libgcc_s_seh-1.dll release/win-temp/
          cp /mingw64/bin/libwinpthread-1.dll release/win-temp/

      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release/win-temp/*" -DestinationPath "AspeQt-2K26-Windows-Portable.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $issFile = Get-ChildItem -Path . -Filter "AspeQt-Installer.iss" -Recurse | Select-Object -First 1
          if ($issFile) {
              Write-Host "Found installer script at: $($issFile.FullName)" -ForegroundColor Cyan
              iscc $issFile.FullName
          } else {
              Write-Error "CRITICAL: Could not find AspeQt-Installer.iss anywhere in the repository!"
              exit 1
          }

      - name: Upload Windows Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: |
            AspeQt-2K26-Windows-Portable.zip
            release/AspeQt-2K26-Setup.exe

  # ==========================================
  # 3. LINUX BUILD (AMD64)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Git (Required for Checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System and Qt6 Dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates unzip wget build-essential cmake pkg-config file libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libxkbcommon-dev libx11-xcb-dev libgl1-mesa-dev libcups2-dev libgpiod-dev
          
      - name: Compile, Package, and Inject Extras
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB
          
          # Inject extras into the generated DEB file
          DEB_FILE=$(ls *.deb | head -n 1)
          mkdir -p repack/DEBIAN
          dpkg-deb -x "$DEB_FILE" repack/
          dpkg-deb -e "$DEB_FILE" repack/DEBIAN
          
          # Create a folder for the assets and copy them in
          mkdir -p repack/usr/share/aspeqt
          cp -r ../doc repack/usr/share/aspeqt/
          cp -r ../atari repack/usr/share/aspeqt/
          cp -r ../python_w_samples repack/usr/share/aspeqt/
          
          # Repack the DEB and rename for release
          dpkg-deb -b repack ../AspeQt-2K26-Linux-amd64.deb

      - name: Upload Linux Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Release
          path: AspeQt-2K26-Linux-amd64.deb

  # ==========================================
  # 4. RASPBERRY PI BUILD (ARM64)
  # ==========================================
  build-pi:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Install Git (Required for Checkout)
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System and Qt6 Dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates unzip wget build-essential cmake pkg-config file libssh-dev qt6-base-dev qt6-serialport-dev qt6-websockets-dev qt6-webchannel-dev qt6-httpserver-dev qt6-tools-dev qt6-l10n-tools libxkbcommon-dev libx11-xcb-dev libgl1-mesa-dev libcups2-dev libgpiod-dev
      
      - name: Compile AspeQt for Pi and Inject Extras
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB
          
          # Inject extras into the generated DEB file
          DEB_FILE=$(ls *.deb | head -n 1)
          mkdir -p repack/DEBIAN
          dpkg-deb -x "$DEB_FILE" repack/
          dpkg-deb -e "$DEB_FILE" repack/DEBIAN
          
          # Create a folder for the assets and copy them in
          mkdir -p repack/usr/share/aspeqt
          cp -r ../doc repack/usr/share/aspeqt/
          cp -r ../atari repack/usr/share/aspeqt/
          cp -r ../python_w_samples repack/usr/share/aspeqt/
          
          # Repack the DEB and rename for release
          dpkg-deb -b repack ../AspeQt-2K26-pi.64.deb

      - name: Upload Pi Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryPi-Release
          path: AspeQt-2K26-pi.64.deb

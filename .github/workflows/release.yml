name: Build and Release AspeQt-2k26

on: 
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. MACOS BUILD (Hardened for Apple Silicon)
  # ==========================================
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Install libssh
        run: brew install libssh

      - name: Compile AspeQt
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Bundle, Sign, and Package
        run: |
          # Bundling libraries first
          macdeployqt build/AspeQt.app -executable="build/AspeQt.app/Contents/MacOS/AspeQt" -always-overwrite
          # Deep signing is MANDATORY to fix your "Invalid Page" crash
          codesign --force --deep --sign - build/AspeQt.app
          # Manual DMG creation ensures the signed app is what gets packaged
          hdiutil create -volname "AspeQt-2K26" -srcfolder build/AspeQt.app -ov -format UDZO AspeQt-2K26-macOS.dmg

      - name: Upload DMG to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Release
          path: AspeQt-2K26-macOS.dmg

  # ==========================================
  # 2. WINDOWS BUILD (Standard MSYS2/MinGW)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and libssh
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-libssh mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: win64_mingw
          modules: 'qtserialport qtwebsockets qtwebchannel qthttpserver'

      - name: Compile AspeQt
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j4

      - name: Package and Copy DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\win-temp"
          Copy-Item "build\AspeQt.exe" "release\win-temp\"
          windeployqt.exe --dir "release\win-temp" "release\win-temp\AspeQt.exe"

- name: Copy MSYS2 Dependencies
        shell: msys2 {0}
        run: |
          # Copying the full dependency chain for LibSSH and MinGW
          cp /mingw64/bin/libssh.dll release/win-temp/
          cp /mingw64/bin/libcrypto-*.dll release/win-temp/
          cp /mingw64/bin/libssl-*.dll release/win-temp/    # <--- Mandatory for SSH
          cp /mingw64/bin/zlib1.dll release/win-temp/
          cp /mingw64/bin/libstdc++-6.dll release/win-temp/  # <--- Mandatory Runtime
          cp /mingw64/bin/libgcc_s_seh-1.dll release/win-temp/
          cp /mingw64/bin/libwinpthread-1.dll release/win-temp/


      - name: Create Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "release\win-temp\*" -DestinationPath "AspeQt-2K26-Windows-Portable.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $issFile = Get-ChildItem -Path . -Filter "AspeQt-Installer.iss" -Recurse | Select-Object -First 1
          if ($issFile) { iscc $issFile.FullName } else { exit 1 }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: |
            AspeQt-2K26-Windows-Portable.zip
            release/AspeQt-2K26-Setup.exe

  # ==========================================
  # 3. LINUX & PI JOBS (Unified Debian 13 Trixie)
  # ==========================================
  build-linux-amd64:
    runs-on: ubuntu-latest
    container: { image: "debian:trixie" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Audited Dependencies
        run: |
          apt-get update && apt-get install -y \
          binutils build-essential ca-certificates cmake file git libcups2-dev \
          libgl1-mesa-dev libgpiod-dev libssh-dev libx11-xcb-dev libxkbcommon-dev \
          pkg-config qt6-base-dev qt6-httpserver-dev qt6-l10n-tools \
          qt6-serialport-dev qt6-tools-dev qt6-webchannel-dev qt6-websockets-dev unzip

      - name: Build and Package
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON
          mv *.deb ../AspeQt-2K26-Linux.deb
          cd ..
          tar -cvzf AspeQt-2K26-Linux-Portable.tar.gz -C build AspeQt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Release
          path: |
            AspeQt-2K26-Linux.deb
            AspeQt-2K26-Linux-Portable.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: { image: "debian:trixie" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Audited Dependencies
        run: |
          apt-get update && apt-get install -y \
          binutils build-essential ca-certificates cmake file git libcups2-dev \
          libgl1-mesa-dev libgpiod-dev libssh-dev libx11-xcb-dev libxkbcommon-dev \
          pkg-config qt6-base-dev qt6-httpserver-dev qt6-l10n-tools \
          qt6-serialport-dev qt6-tools-dev qt6-webchannel-dev qt6-websockets-dev unzip

      - name: Build and Package
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
          cpack -G DEB -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON
          mv *.deb ../AspeQt-2K26-pi.64.deb
          cd ..
          tar -cvzf AspeQt-2K26-pi.64-portable.tar.gz -C build AspeQt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryPi-Release
          path: |
            AspeQt-2K26-pi.64.deb
            AspeQt-2K26-pi.64-portable.tar.gz
